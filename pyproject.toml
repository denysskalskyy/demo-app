[project]
name = "post-delivery-support-demo-app"
version = "0.1.0"
description = "Acme Forex Analytics Dashboard - CAD vs USD spot rates analytics sandbox"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pyyaml>=6.0.1",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
